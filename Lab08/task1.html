<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 1 - Penguin Data (D3.js Lab)</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    svg { max-width: 100%; display: block; margin-bottom: 30px; }
  </style>
</head>
<body>
  <!-- Step 1 prediction: Gentoo would be the heaviest -->

  <h2>Step 2: Average Body Mass by Species</h2>
  <svg id="chart1" width="700" height="450"></svg>

  <h2>Step 3: Average Flipper Length by Species</h2>
  <svg id="chart2" width="700" height="450"></svg>

  <h2>Step 4: Average Body Mass by Island</h2>
  <svg id="chart3" width="700" height="450"></svg>

  <script>
    function drawBarChart({ svgId, data, groupBy, valueFn, title, yLabel }) {
      const svg = d3.select(svgId);
      const width = 700, height = 450;
      const margin = { top: 30, right: 30, bottom: 70, left: 80 };
      const innerWidth = width - margin.left - margin.right;
      const innerHeight = height - margin.top - margin.bottom;

      const chart = svg.append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      const summary = Array.from(
        d3.rollup(data, valueFn, d => d[groupBy]),
        ([name, value]) => ({ name, value })
      );
      const maxValue = d3.max(summary, d => d.value);

      const x = d3.scaleBand()
        .domain(summary.map(d => d.name))
        .range([0, innerWidth])
        .padding(0.3);

      const y = d3.scaleLinear()
        .domain([0, maxValue])
        .nice()
        .range([innerHeight, 0]);

      chart.append("g")
        .attr("transform", `translate(0,${innerHeight})`)
        .call(d3.axisBottom(x));
      chart.append("g").call(d3.axisLeft(y));

      chart.selectAll("rect")
        .data(summary)
        .join("rect")
        .attr("x", d => x(d.name))
        .attr("y", d => y(d.value))
        .attr("width", x.bandwidth())
        .attr("height", d => innerHeight - y(d.value))
        .attr("fill", d => d.value === maxValue ? "red" : "blue");

      chart.append("text")
        .attr("x", innerWidth / 2).attr("y", -5)
        .attr("text-anchor", "middle")
        .style("font-size", "16px")
        .text(title);

      chart.append("text")
        .attr("transform", "rotate(-90)")
        .attr("x", -innerHeight / 2).attr("y", -55)
        .attr("text-anchor", "middle")
        .text(yLabel);
    }

    d3.csv(
      "https://raw.githubusercontent.com/cran/palmerpenguins/master/inst/extdata/penguins.csv",
      d3.autoType
    ).then(data => {
      data = data.filter(d =>
        d.species && d.island &&
        d.body_mass_g != null && d.flipper_length_mm != null
      );

      drawBarChart({
        svgId: "#chart1", data, groupBy: "species",
        valueFn: v => d3.mean(v, d => d.body_mass_g),
        title: "Average Body Mass by Species",
        yLabel: "Body Mass (g)"
      });

      drawBarChart({
        svgId: "#chart2", data, groupBy: "species",
        valueFn: v => d3.mean(v, d => d.flipper_length_mm),
        title: "Average Flipper Length by Species",
        yLabel: "Flipper Length (mm)"
      });

      drawBarChart({
        svgId: "#chart3", data, groupBy: "island",
        valueFn: v => d3.mean(v, d => d.body_mass_g),
        title: "Average Body Mass by Island",
        yLabel: "Body Mass (g)"
      });
    }).catch(error => {
      console.error("Could not load penguin data:", error);
      document.body.insertAdjacentHTML("beforeend",
        "<p>Could not load the data. Check your internet connection and the Console.</p>");
    });
  </script>
</body>
</html>
