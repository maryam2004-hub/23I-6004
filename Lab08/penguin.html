<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Penguin Data - D3.js Lab</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }
    svg {
      max-width: 100%;
    }
  </style>
</head>
<body>
  <h2>Average Body Mass by Penguin Species</h2>
  <svg id="chart" width="700" height="450"></svg>

  <script>
    const svg = d3.select("#chart");
    const width = 700;
    const height = 450;
    const margin = { top: 30, right: 30, bottom: 70, left: 80 };

    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;

    const chart = svg.append("g")
      .attr("transform",
        `translate(${margin.left},${margin.top})`);

    d3.csv(
      "https://raw.githubusercontent.com/cran/palmerpenguins/master/inst/extdata/penguins.csv",
      d3.autoType
    ).then(data => {
      // Remove rows with missing values
      data = data.filter(d =>
        d.species &&
        d.body_mass_g != null &&
        d.flipper_length_mm != null &&
        d.island
      );

      // Calculate average body mass for each species
      const summary = Array.from(
        d3.rollup(
          data,
          v => d3.mean(v, d => d.body_mass_g),
          d => d.island
        ),
        ([island, bodyMass]) => ({ island, bodyMass })
      );

      const x = d3.scaleBand()
        .domain(summary.map(d => d.species))
        .range([0, innerWidth])
        .padding(0.3);

      const y = d3.scaleLinear()
        .domain([0, d3.max(summary, d => d.flipperLength)])
        .nice()
        .range([innerHeight, 0]);

      chart.append("g")
        .attr("transform", `translate(0,${innerHeight})`)
        .call(d3.axisBottom(x));

      chart.append("g")
        .call(d3.axisLeft(y));

      chart.selectAll("rect")
        .data(summary)
        .join("rect")
        .attr("x", d => x(d.species))
        .attr("y", d => y(d.flipperLength)) // step 3
        .attr("width", x.bandwidth())
        .attr("height", d => innerHeight - y(d.flipperLength)) // step 3
        .attr("fill", d => d.species === "Gentoo" ? "red" : "blue"
        // ghento to red  
      );

      chart.append("text")
        .attr("x", innerWidth / 2)
        .attr("y", -5)
        .attr("text-anchor", "middle")
        .style("font-size", "16px")
        .text("Average Flipper Length by Penguin Species");

      chart.append("text")
        .attr("transform", "rotate(-90)")
        .attr("x", -innerHeight / 2)
        .attr("y", -55)
        .attr("text-anchor", "middle")
        .text("Flipper Length (mm)");

      const x2 = d3.scaleBand()
        .domain(summary.map(d => d.island))
        .range([0, innerWidth])
        .padding(0.3);

      const y2 = d3.scaleLinear()
        .domain([0, d3.max(summary, d => d.bodyMass)])
        .nice()
        .range([innerHeight, 0]);

      const maxMass = d3.max(summary, d => d.bodyMass);

      chart.selectAll("rect")
        .data(summary)
        .join("rect")
        .attr("x", d => x(d.island))
        .attr("y", d => y(d.bodyMass))
        .attr("width", x3.bandwidth())
        .attr("height", d => innerHeight - y(d.bodyMass))
        .attr("fill", d => d.bodyMass === maxMass ? "red" : "blue");
    }).catch(error => {
      console.error("Could not load penguin data:", error);
      document.body.insertAdjacentHTML(
        "beforeend",
        "<p>Could not load the data. Check your internet connection and the Console.</p>"
      );
    });
  </script>
</body>
</html>
